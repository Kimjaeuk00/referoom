plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
}

group = 'workplace'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 의존성 버전 관리
    implementation platform(
        'org.springframework.boot:spring-boot-dependencies:4.0.8'
    )

    // Lombok 처리에 사용하는 의존성도 동일한 버전 기준 적용
    annotationProcessor platform(
        'org.springframework.boot:spring-boot-dependencies:4.0.8'
    )

    // REST API
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // JWT 기반 API 인증 및 접근 제어
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 요청 데이터 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JPA · Hibernate · DB 연결 풀
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // MariaDB JDBC 드라이버
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'

    // JWT 발급 및 검증
    implementation 'com.auth0:java-jwt:4.4.0'

    // 비밀번호 BCrypt 암호화
    implementation 'org.mindrot:jbcrypt:0.4'

    // Lombok: getter·생성자 등 자동 생성
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Swagger UI 및 OpenAPI 명세 자동 생성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
}

// Spring Boot 실행 클래스
springBoot {
    mainClass = 'workplace.AuthServerApplication'
}
