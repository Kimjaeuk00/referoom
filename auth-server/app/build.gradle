plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
}

group = 'workplace'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 관련 라이브러리 버전 관리
    implementation platform(
        'org.springframework.boot:spring-boot-dependencies:4.0.8'
    )

    // REST API 서버
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 요청 데이터 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 기존 코드에서 사용하는 라이브러리 유지
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'org.mindrot:jbcrypt:0.4'

    // JPA · Hibernate · DB 연결 풀
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}

// 기존 main 클래스들과 구분해 Spring Boot 시작 클래스 지정
springBoot {
    mainClass = 'workplace.AuthServerApplication'
}

// 기존 DB 예제 실행 작업 유지
tasks.register('runDbExample', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'workplace.DbExample'
}