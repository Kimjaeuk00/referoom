server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 해시가 붙은 빌드 파일은 오래 캐시한다
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA 폴백: /ask, /library 같은 주소로 새로고침해도 index.html을 돌려준다
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
